name: Agentic SEO & Indexation Telemetry

on:
  schedule:
    # Runs at 02:00 UTC every Tuesday and Friday
    - cron: '0 2 * * 2,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agentic-growth:
    runs-on: ubuntu-latest
    name: Autonomous Agentic Growth Loop
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run LLM Content Generation (Smart Fallback)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx tsx scripts/agentic-growth-loop.ts

      - name: Commit and Push New pSEO Routes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add content/solutions/
          git commit -m "feat(seo): auto-generate new pSEO programmatic solution [skip ci]" || echo "No changes to commit"
          git push origin main

  telemetry:
    needs: agentic-growth
    runs-on: ubuntu-latest
    name: Health Check & Sitemap Ping
    steps:
      - name: Ping Search Engines with Sitemap
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://zadit.pages.dev/sitemap.xml" || true
          curl -s "https://www.bing.com/ping?sitemap=https://zadit.pages.dev/sitemap.xml" || true
          echo "Sitemaps submitted successfully."
