name: Agentic SEO & Indexation Telemetry

on:
  schedule:
    # Runs at 02:00 UTC every Tuesday and Friday (Free public repo runner)
    - cron: '0 2 * * 2,5'
  workflow_dispatch:

jobs:
  telemetry:
    runs-on: ubuntu-latest
    name: Health Check & Sitemap Ping
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Live Endpoints
        run: |
          urls=(
            "https://zadit.pages.dev/"
            "https://zadit.pages.dev/cv/"
            "https://zadit.pages.dev/layanan/dokumen-administrasi-bisnis/"
            "https://zadit.pages.dev/layanan/seo-konten-konversi/"
            "https://zadit.pages.dev/layanan/olah-data-statistik-sinta/"
            "https://zadit.pages.dev/layanan/solusi-web-performa/"
            "https://zadit.pages.dev/solusi/"
            "https://zadit.pages.dev/solusi/proposal-bisnis-rantai-pasok-investor/"
            "https://zadit.pages.dev/wawasan/"
            "https://zadit.pages.dev/sitemap.xml"
            "https://zadit.pages.dev/robots.txt"
            "https://zadit.pages.dev/llms.txt"
            "https://zadit.pages.dev/cv.json"
          )
          for u in "${urls[@]}"; do
            code=$(curl -s -L -o /dev/null -w "%{http_code}" "$u")
            echo "$code : $u"
            if [ "$code" -ne 200 ]; then
              echo "Error: Endpoint $u returned $code"
              exit 1
            fi
          done
          echo "All core endpoints healthy (200 OK)."

      - name: Ping Search Engines with Sitemap
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://zadit.pages.dev/sitemap.xml" || true
          curl -s "https://www.bing.com/ping?sitemap=https://zadit.pages.dev/sitemap.xml" || true
          echo "Sitemaps submitted successfully."
